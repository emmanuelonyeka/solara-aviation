<!doctype html>
<html lang="__SITE_LANGUAGE__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="__THEME_COLOR__" />
    <link rel="manifest" href="/site.webmanifest" />
    <title data-static-meta="true">__SITE_TITLE__</title>
    <meta data-static-meta="true" name="description" content="__SITE_DESCRIPTION__" />
    <meta data-static-meta="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="__SITE_NAME__" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Painted before any stylesheet loads, so the first frame is never
         white. color-scheme stops the browser compositing a light default. -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background-color: #0B0C0F; }
    </style>
    <meta data-static-meta="true" property="og:title" content="__SITE_TITLE__" />
    <meta data-static-meta="true" property="og:description" content="__SITE_DESCRIPTION__" />
    <meta data-static-meta="true" property="og:image" content="__SITE_IMAGE__" />
    <meta data-static-meta="true" property="og:image:alt" content="__SITE_IMAGE_ALT__" />
    <meta data-static-meta="true" property="og:type" content="website" />
    <meta data-static-meta="true" property="og:url" content="__SITE_URL__" />
    <meta data-static-meta="true" property="og:site_name" content="__SITE_NAME__" />
    <meta data-static-meta="true" property="og:locale" content="__SITE_LOCALE__" />
    <meta data-static-meta="true" name="twitter:card" content="summary_large_image" />
    <meta data-static-meta="true" name="twitter:title" content="__SITE_TITLE__" />
    <meta data-static-meta="true" name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta data-static-meta="true" name="twitter:image" content="__SITE_IMAGE__" />
    <meta data-static-meta="true" name="twitter:image:alt" content="__SITE_IMAGE_ALT__" />
    <link data-static-meta="true" rel="canonical" href="__SITE_URL__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="margin: 0; padding: 2rem; background: #0B0C0F; color: #F3F0E6; font: 16px/1.6 system-ui, sans-serif;">
        JavaScript is required to use the __SITE_NAME__ website and its flight-request experience.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
